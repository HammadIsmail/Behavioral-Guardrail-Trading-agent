{% extends "auth_base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Create an account</h2>
    <p style="margin-bottom: 16px; background: #1e2a3a; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;">For testing: username <strong>test2</strong>, password <strong>hello1234</strong></p>
    <form method="post" action="/register">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
